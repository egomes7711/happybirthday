<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Georgia,"Times New Roman",serif;background:linear-gradient(135deg,#f8eee8,#fffaf7);color:#3d302b;text-align:center}
.card{width:min(90%,620px);padding:60px 35px;background:rgba(255,255,255,.88);border-radius:20px;box-shadow:0 18px 50px rgba(80,55,45,.12)}
h1{font-size:clamp(38px,7vw,58px);font-weight:normal;margin:0 0 24px}
.message{font-size:20px;line-height:1.7;margin:0 auto 34px;max-width:500px}
button{border:0;padding:15px 28px;border-radius:999px;background:#3d302b;color:white;font-family:Georgia,"Times New Roman",serif;font-size:16px;cursor:pointer;transition:transform .2s,opacity .2s}
button:hover{transform:translateY(-2px);opacity:.92}
.tiny{margin-top:25px;font-size:12px;opacity:.55;letter-spacing:1px}
</style>
</head>
<body>
<main class="card">
<h1>Happy Birthday</h1>
<p class="message">Click the below link to determine what you may want following our dinner on Saturday, October 24th.</p>
<button onclick="openSurprise()">Open Your Surprise</button>
<div class="tiny">Made especially for you</div>
</main>
<script>
function openSurprise(){window.location.href="https://us.louisvuitton.com/eng-us/women/small-leather-goods/all-wallets-and-small-leather-goods/_/N-t164iz3b";}
</script>
</body>
</html>
