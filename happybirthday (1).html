<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Surprise ❤️</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Georgia, "Times New Roman", serif;
        background: linear-gradient(135deg, #f8eee8, #fffaf7);
        color: #3d302b;
        text-align: center;
    }
    .card {
        width: min(90%, 620px);
        padding: 60px 35px;
        background: rgba(255,255,255,.88);
        border-radius: 20px;
        box-shadow: 0 18px 50px rgba(80,55,45,.12);
    }
    .heart {
        font-size: 42px;
        margin-bottom: 10px;
        animation: pulse 1.8s infinite;
    }
    h1 {
        font-size: clamp(38px, 7vw, 58px);
        font-weight: normal;
        margin: 0 0 12px;
    }
    .subtitle {
        font-size: 20px;
        line-height: 1.6;
        margin: 0 auto 30px;
        max-width: 480px;
    }
    .message {
        font-size: 17px;
        line-height: 1.7;
        margin: 0 auto 34px;
        max-width: 470px;
    }
    button {
        border: 0;
        padding: 15px 28px;
        border-radius: 999px;
        background: #3d302b;
        color: white;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 16px;
        cursor: pointer;
        transition: transform .2s, opacity .2s;
    }
    button:hover { transform: translateY(-2px); opacity: .92; }
    .tiny {
        margin-top: 25px;
        font-size: 12px;
        opacity: .55;
        letter-spacing: 1px;
    }
    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
    }
</style>
</head>
<body>
    <main class="card">
        <div class="heart">♥</div>
        <h1>Happy Birthday</h1>

        <p class="subtitle">
            To the woman who makes every day a little more special.
        </p>

        <p class="message">
            I wanted to give you a little surprise this year.
            No hints. No peeking. Just click the button when you're ready. ❤️
        </p>

        <button onclick="openSurprise()">Open Your Surprise</button>

        <div class="tiny">Made especially for you</div>
    </main>

<script>
function openSurprise() {
    window.location.href = "https://us.louisvuitton.com/";
}
</script>
</body>
</html>
